[package]
name = "omatrimio"
version = "0.1.0"
description = "A Stremio-compatible media center with the Omarchy look"
authors = ["omatrimio contributors"]
homepage = "https://github.com/Pakvothe/omatrimio"
repository = "https://github.com/Pakvothe/omatrimio"
license = "GPL-3.0-only"
edition = "2024"

[features]
offline-build = []

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_20"] }
gdk-wayland = { package = "gdk4-wayland", version = "0.11.4", features = ["v4_20", "wayland_crate"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
webkit = { package = "webkit6", version = "0.6.1", features = ["v2_52"] }
ashpd = { version = "0.13.13", features = ["background", "gtk4", "inhibit", "open_uri", "file_chooser"] }
ksni = "0.3.6"
mpris-server = "0.10.0"
clap = { version = "4.6.5", features = ["derive"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
tokio = { version = "1.53.1", features = ["full"] }
libloading = "0.9.0"
epoxy = "0.1.0"
flume = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = "1.0.229"
serde_json = "1.0.151"
itertools = "0.15.0"
libmpv2 = { version = "5.0.3", git = "https://github.com/Stremio/libmpv2-rs" }
image = "0.25.10"
chrono = "0.4.45"
anyhow = "1.0.104"
url = "2.5.8"
dirs = "6.0.0"
base64 = "0.23.0"
libc = "0.2.189"
discord-rich-presence = "1.1.0"
shellexpand = "3.1.2"

[build-dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
